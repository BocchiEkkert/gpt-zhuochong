name: Ubuntu 26.04 validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      options: --shm-size=1g
    env:
      MORI_TEST_NO_SANDBOX: '1'
    steps:
      - name: Install Ubuntu desktop test and package dependencies
        run: |
          apt-get update
          apt-get install -y git ca-certificates curl python3 xvfb xauth fakeroot dpkg binutils libcrypt1 libglib2.0-0t64 libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libdrm2 libgtk-3-0t64 libgbm1 libasound2t64 libx11-xcb1 libsecret-1-0 libnotify4 libxtst6 libxss1 libxrandr2 libxdamage1 libxcomposite1 libxfixes3 libxkbcommon0 libxcb1 libcups2t64 libxshmfence1 fonts-noto-cjk
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install Chromium for UI tests
        run: npx playwright-core install chromium
      - name: Test browser UI
        env:
          CHROMIUM_PATH: ''
        run: node scripts/ci-check.cjs --test tests/ui.test.cjs
      - name: Test native X11 windows on Ubuntu 26.04
        run: xvfb-run -a node scripts/ci-check.cjs tests/desktop-smoke.cjs
      - name: Build Ubuntu x64 DEB
        run: node scripts/ci-check.cjs scripts/build-linux.cjs
      - name: Verify DEB installation on Ubuntu 26.04
        run: |
          apt-get install -y ./dist/*.deb
          dpkg-query -W gpt-miko-pet
          test -x '/opt/Miko GPT Pet/gpt-miko-pet'
      - name: Test installed Ubuntu package
        env:
          MIKO_TEST_EXECUTABLE: /opt/Miko GPT Pet/gpt-miko-pet
        run: xvfb-run -a node scripts/ci-check.cjs tests/desktop-smoke.cjs
      - name: Save Ubuntu DEB download
        uses: actions/upload-artifact@v4
        with:
          name: Miko-Ubuntu-26.04-x64
          path: dist/*.deb
          if-no-files-found: error
